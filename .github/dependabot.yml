# GitHub Dependabot configuration for automated dependency management
version: 2
updates:
  # Package ecosystem updates
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'

    # Pull request configuration
    open-pull-requests-limit: 10

    # Version strategy
    versioning-strategy: 'widen'

    # Commit message configuration
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(dev-deps)'

    # Keep Node.js 20 support: tsup 9 needs Node >= 22.18 and Node-RED 5
    # needs Node >= 22. CI tests Node-RED 5 via a matrix install instead.
    ignore:
      - dependency-name: 'tsup'
        update-types: ['version-update:semver-major']
      - dependency-name: 'node-red'
        update-types: ['version-update:semver-major']

  # GitHub Actions workflow updates
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '10:00'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
