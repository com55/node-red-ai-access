name: CI

on:
  push:
    branches: [main, develop, 'dev/**']
    tags: ['v*']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  YARN_VERSION: '4.9.4'
  REGISTRY_URL: 'ghcr.io'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      # Checkout is required for push/tag events; PRs can use the GitHub API.
      - name: Checkout code
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7

      - name: Filter paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'Dockerfile.*'
              - '**/Dockerfile'
              - '**/Dockerfile.*'
              - 'docker/**'
              - 'docker-compose*.yml'
              - 'docker-compose*.yaml'
              - '.dockerignore'
              - 'package.json'
              - 'yarn.lock'
              - '.github/workflows/ci.yml'

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type checking
        run: yarn type-check

      - name: Lint code
        run: yarn lint

      - name: Check code formatting
        run: yarn format:check

      - name: Security audit
        run: yarn audit --groups dependencies
        continue-on-error: true

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '23']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build project
        run: yarn build

      - name: Run unit tests
        run: yarn test --reporter=verbose --coverage
        env:
          NODE_ENV: test
          NODERED_SKIP_CREDENTIAL_VALIDATION: 'true'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        timeout-minutes: 3
        continue-on-error: true
        if: matrix.node-version == '22'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    needs: [quality]

    services:
      node-red:
        image: nodered/node-red:latest
        env:
          NODE_ENV: development
        options: >-
          --health-cmd "curl -f http://localhost:1880 || exit 1" --health-interval 30s --health-timeout 10s --health-retries 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: node .yarn/releases/yarn-stable-temp.cjs install --immutable

      - name: Build project
        run: node .yarn/releases/yarn-stable-temp.cjs build:prod

      - name: Wait for Node-RED to be ready
        run: timeout 90s bash -c 'until curl -sf http://node-red:1880; do sleep 3; done'

      - name: Allocate isolated MCP port
        run: echo "MCP_PORT=$((20000 + GITHUB_RUN_ID % 40000))" >> "$GITHUB_ENV"

      - name: Start MCP server in background
        run: PORT="$MCP_PORT" CORS_ORIGIN="http://localhost:3000,http://localhost:$MCP_PORT" node dist/index.mjs > "$RUNNER_TEMP/mcp-server.log" 2>&1 &
        env:
          NODE_ENV: test
          NODERED_SKIP_CREDENTIAL_VALIDATION: 'true'
          MCP_TRANSPORT: http
          HTTP_ENABLED: true
          NODERED_URL: http://node-red:1880
          JWT_SECRET: ci-test-secret-minimum-32-characters-ok

      - name: Wait for MCP server to be ready
        run: |
          timeout 60s bash -c 'until curl -sf http://localhost:$MCP_PORT/health; do sleep 2; done' || \
          (echo "=== MCP server log ===" && cat "$RUNNER_TEMP/mcp-server.log" && exit 1)

      - name: Run E2E tests
        run: BASE_URL="http://localhost:$MCP_PORT" node .yarn/releases/yarn-stable-temp.cjs test:e2e
        env:
          NODERED_URL: http://node-red:1880

      - name: Upload E2E test results
        uses: actions/upload-artifact@v7
        timeout-minutes: 3
        continue-on-error: true
        if: always()
        with:
          name: e2e-results-${{ github.run_id }}
          path: |
            e2e-results/
            test-results/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule'

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript'

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, quality, test]
    # Skipped jobs report as success for required checks. Run on matching
    # path changes (PR/push) or on version tag pushes (v*).
    if: >
      always() &&
      github.event_name != 'schedule' &&
      needs.changes.result == 'success' &&
      needs.quality.result == 'success' &&
      needs.test.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.docker == 'true')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compute build time
        id: build-time
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        # Publish only on push to protected branches; PR builds validate the image without push.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_URL }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            YARN_VERSION=${{ env.YARN_VERSION }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build-time.outputs.time }}
