name: CI

on:
  push:
    branches: [main, 'dev/**']
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Type checking
        run: yarn type-check

      - name: Lint code
        run: yarn lint

      - name: Check code formatting
        run: yarn format:check

      - name: Check MCP tools docs are fresh
        run: yarn check:mcp-tools

      - name: Check error-code docs are fresh
        run: yarn check:errors

      - name: Security audit
        run: yarn npm audit --environment production
        continue-on-error: true

  test:
    name: Test (Node ${{ matrix.node-version }}, Node-RED ${{ matrix.node-red }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
        node-red: ['4.1.x', '5.0.x']
        exclude:
          # Node-RED 5 requires Node.js >= 22.
          - node-version: '20'
            node-red: '5.0.x'
          # Node-RED 4.1 is covered on Node 20 and 22.
          - node-version: '24'
            node-red: '4.1.x'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Swap in the matrix Node-RED version without touching package.json or
      # yarn.lock (the devDependency stays on 4.x so Node 20 keeps working).
      - name: Install Node-RED ${{ matrix.node-red }}
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --legacy-peer-deps "node-red@${{ matrix.node-red }}"
          node -p "'node-red ' + require('node-red/package.json').version"

      - name: Build project
        run: yarn build

      - name: Run unit tests
        run: yarn test --reporter=verbose --coverage
        env:
          NODE_ENV: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        timeout-minutes: 3
        continue-on-error: true
        if: matrix.node-version == '22' && matrix.node-red == '4.1.x'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule'

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript'
