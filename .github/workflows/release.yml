name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1.0)'
        required: true
        type: string

# One release run per tag; never cancel a publish in progress.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # create/update the GitHub release
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    name: Publish to npm and GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use a recent npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Check tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version v$version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # Prerelease versions (e.g. 0.2.0-beta.1) go to the "beta" dist-tag
          # and are marked as GitHub pre-releases; stable versions are unchanged.
          case "$version" in
            *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
            *) echo "PRERELEASE=false" >> "$GITHUB_ENV" ;;
          esac
          echo "PACKAGE_NAME=$(node -p "require('./package.json').name")" >> "$GITHUB_ENV"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Quality
        run: yarn quality

      # Build before testing: some tests check the built dist/plugin.cjs.
      - name: Production build
        run: yarn build:prod

      - name: Test
        run: yarn test

      - name: Pack tarball
        run: |
          mkdir -p release
          npm pack --pack-destination release
          ls -l release

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "$PACKAGE_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$VERSION is already on npm; skipping publish."
            exit 0
          fi
          # "./" stops npm from reading release/x.tgz as a GitHub user/repo shorthand.
          tarball="$(ls ./release/*.tgz)"
          tag_args=()
          if [ "$PRERELEASE" = "true" ]; then
            tag_args=(--tag beta)
          fi
          if [ -n "$NPM_TOKEN" ]; then
            echo "Publishing with the NPM_TOKEN secret (first-publish fallback)."
            NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish "$tarball" --access public --provenance "${tag_args[@]}"
          else
            echo "Publishing with npm trusted publishing (OIDC)."
            unset NODE_AUTH_TOKEN
            npm publish "$tarball" --access public --provenance "${tag_args[@]}"
          fi

      - name: Extract CHANGELOG section
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            if [ "$PRERELEASE" = "true" ]; then
              echo "::warning::No CHANGELOG section found for $VERSION; using a default note"
              echo "Pre-release $TAG. See CHANGELOG.md for details." > release-notes.md
            else
              echo "::error::No CHANGELOG section found for $VERSION"
              exit 1
            fi
          fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="$(ls ./release/*.tgz)"
          release_args=()
          if [ "$PRERELEASE" = "true" ]; then
            release_args=(--prerelease --latest=false)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md "${release_args[@]}"
            gh release upload "$TAG" "$tarball" --clobber
          else
            gh release create "$TAG" "$tarball" --title "$TAG" --notes-file release-notes.md --verify-tag "${release_args[@]}"
          fi
