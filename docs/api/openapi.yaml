              type: string
              description: Raw bearer token (returned only at creation)
            url:
              type: string
              nullable: true
              description: >
                Self-contained GET link (`http(s)://{host}{httpAdminRoot}/mcp/a/{token}`).
                Present for kind=get_link; omitted for rest/mcp. The get-link
                URL itself has no create-link operation.

