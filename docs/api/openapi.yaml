openapi: 3.1.0

info:
  title: Node-RED AI Access Plugin API
  version: 0.1.0
  summary: Temporary, owner-approved Node-RED access for AI clients
  description: |
    REST surface exposed by the `@com55/node-red-ai-access` Node-RED plugin
    under the editor admin root (respects `httpAdminRoot`).

    ## Base path

    All routes are under `{httpAdminRoot}/mcp/api/v1`
    (for example `/mcp/api/v1` when `httpAdminRoot` is `/`).

    ## Quick start for access-link clients

    ### Self-contained GET link (no headers)

    Prefer this when the AI can only issue HTTP GET (no `Authorization` header,
    no MCP). Creating a link returns `url` like
    `http(s)://{host}{httpAdminRoot}/mcp/a/{token}` (default TTL **4h**).

    1. `GET {url}` — markdown docs (workflow, exact paths, errors, limits).
    2. `GET {url}/status`, `/flows`, `/flows/{id}`, `/proposals`, …
    3. Small edits: `GET {url}/propose?flow=&rev=&node=&set.<prop>=&summary=`
    4. Larger / multi-node / add / remove: `GET {url}/propose?flow=&rev=&patch=<base64url JSON>`
       where the JSON is either `nodes:[{op:'set'|'add'|'remove',...}]` or a
       full `replace_flow` document (URL soft-cap ~8KB → use chunked drafts;
       prefer ~4–5 KB raw chunks; base64url adds ~33%).
    5. Chunked drafts: `…/draft/new` → `…/draft/{id}/append?seq=&data=` →
       `…/draft/{id}/submit?sha256=` (30 min expiry, 1.5MB **decoded** bytes;
       field mode validates node/field at `draft/new`; `mode=json` may add nodes).
    6. Human approves on `/mcp`. JSON uses `Cache-Control: no-store`.
       Unknown paths under `/mcp/a/*` return JSON `not_found` (never echo the token).

    ### Bearer REST (clients that can send headers)

    Plain HTTP AI clients (no MCP required) can also use an access-link token
    and this REST API:

    1. Ask the user for an access link from the `/mcp` admin page (**Access
       links** → Create). Prefer the copy-link output (full GET `url` + Bearer
       token + docs hint).
    2. Discover endpoints (no auth): `GET {httpAdminRoot}/mcp/api/v1`.
    3. Send `Authorization: Bearer <token>` on every authenticated call.
    4. Read flows: `GET /flows`, then `GET /flows/{id}` (response always
       includes `flow.type`, defaulting to `tab`).
    5. Submit a proposal:

    ```json
    {
      "type": "replace_flow",
      "expectedRev": "<rev from GET /flows or /flows/{id}>",
      "payload": {
        "flowId": "tab1",
        "flow": {
          "id": "tab1",
          "type": "tab",
          "label": "Flow 1",
          "nodes": [{ "id": "n1", "type": "inject", "z": "tab1", "wires": [[]] }]
        }
      }
    }
    ```

    Missing tokens return **401** `access_link_missing`; invalid/expired/revoked
    tokens return **401** `access_link_invalid`. Both tell you to ask the user
    for a new link. OpenAPI: `GET /openapi.yaml`. MCP (optional):
    `POST {httpAdminRoot}/mcp/rpc` with the same Bearer token.

    ## MCP JSON-RPC

    AI clients may also use MCP Streamable HTTP at `{httpAdminRoot}/mcp/rpc`
    with the same access-link Bearer token. Tools mirror the AI-facing REST
    operations (`get_status`, `list_flows`, `get_flow`, `submit_proposal`,
    `list_my_proposals`, `get_proposal`). Approve/reject/link management stay
    on this REST API and the `/mcp` admin page. This OpenAPI document covers
    the REST surface only.

    ## Authentication

    - **Admin session** — Node-RED `adminAuth` cookie/session. Users with
      `read` may view status, flows, proposals, and logs. Users with `*` may
      also manage access links and approve/reject proposals.
    - **Access-link Bearer token** — temporary token minted by an admin with
      `*`. AI clients send `Authorization: Bearer <token>` to read flows and
      submit proposals (REST and `/mcp/rpc`). Tokens are in-memory only (lost
      on restart).

    When an access-link token is **missing**, AI-facing routes return **401**
    with `code: access_link_missing`. When the token is **invalid**, expired,
    revoked, or cleared by a restart, they return **401** with
    `code: access_link_invalid`. Both include `WWW-Authenticate: Bearer` and a
    message that tells the AI to ask the user for a new access link.

    ## Admin page (`GET /mcp`)

    The HTML shell is served **without** adminAuth so the browser can read the
    Node-RED editor token from `localStorage` (editors do not use cookies) and
    call APIs with `Authorization: Bearer`. All data and mutating actions stay
    behind `needsPermission` / access-link checks.

    ## Size limits

    Proposal JSON is capped at **1_500_000 bytes** (`MAX_PROPOSAL_JSON_BYTES`).
    Oversized proposal JSON or audit append payloads return **413** with
    `code: payload_too_large` (never silently truncate). Malformed JSON
    bodies return **400** JSON (`code: invalid_json` on REST;
    JSON-RPC `-32700` Parse error on `/mcp/rpc`) — never HTML stack traces.
    Unauthenticated admin API calls return JSON `{ code: auth_required }`
    (not plain-text `Unauthorized` from `needsPermission`).
    The MCP endpoint shares the same limits, rate limiting, and audit logging
    as REST.

  contact:
    name: com55
    url: https://github.com/com55/node-red-ai-access
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /mcp/api/v1
    description: Relative to Node-RED httpAdminRoot (default `/`)

tags:
  - name: Status
  - name: Access links
  - name: Flows
  - name: Proposals
  - name: Audit log
  - name: Spec

paths:
  /:
    get:
      tags: [Spec]
      summary: Discovery index (no auth)
      description: |
        Unauthenticated JSON index listing auth scheme, OpenAPI URL, MCP
        endpoint, and available REST paths. Intended for plain HTTP AI clients.
      operationId: getDiscoveryIndex
      security: []
      responses:
        '200':
          description: Discovery payload
          content:
            application/json:
              schema:
                type: object
                required: [ok, auth, openapi, mcp, endpoints]
                properties:
                  ok:
                    type: boolean
                  name:
                    type: string
                  version:
                    type: string
                  auth:
                    type: object
                    required: [scheme, header]
                    properties:
                      scheme:
                        type: string
                        const: Bearer
                      header:
                        type: string
                        example: 'Authorization: Bearer <token>'
                      description:
                        type: string
                  openapi:
                    type: string
                  mcp:
                    type: string
                  apiBase:
                    type: string
                  endpoints:
                    type: array
                    items:
                      type: object
                      required: [method, path, auth, summary]
                      properties:
                        method:
                          type: string
                        path:
                          type: string
                        auth:
                          type: string
                        summary:
                          type: string

  /openapi.yaml:
    get:
      tags: [Spec]
      summary: OpenAPI document (YAML)
      operationId: getOpenApiYaml
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 YAML for this API
          content:
            application/yaml:
              schema:
                type: string

  /status:
    get:
      tags: [Status]
      summary: Plugin status
      description: |
        Accepts an **admin session** or a valid **access-link Bearer**.
        Access-link callers receive `permission: null` and a `caller` object
        with link label, expiry, permissions, and base URLs.
      operationId: getStatus
      security:
        - AdminSession: []
        - AccessLinkBearer: []
      responses:
        '200':
          description: Status payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /settings:
    get:
      tags: [Status]
      summary: Get effective AI Access settings
      description: |
        Returns effective settings with precedence metadata
        (`disk` → `settings.js` → built-in defaults). Admin `read` or `*`.
        `read` users get `canEdit: false`; `*` can PUT.
      operationId: getAiAccessSettings
      security:
        - AdminSession: []
      responses:
        '200':
          description: Effective settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAccessSettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Status]
      summary: Update AI Access settings (persist to disk)
      description: |
        Requires `*`. Writes `<userDir>/.ai-access/settings.json` and applies
        immediately (no restart). Partial body merges into existing disk
        overrides.
      operationId: putAiAccessSettings
      security:
        - AdminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiAccessSettingsPatch'
      responses:
        '200':
          description: Updated effective settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAccessSettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /links:
    get:
      tags: [Access links]
      summary: List active access links
      description: Requires full admin permission (`*`).
      operationId: listLinks
      security:
        - AdminSession: []
      responses:
        '200':
          description: Active links (no raw tokens)
          content:
            application/json:
              schema:
                type: object
                required: [links]
                properties:
                  links:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccessLinkPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Access links]
      summary: Create an access link
      description: |
        Requires full admin permission (`*`). The raw `token` is returned
        **once** in this response (plus a self-contained `url` for GET-only
        clients at `/mcp/a/<token>`). Default TTL is 14400 seconds (4h); max
        active links defaults to 10 (`aiAccess.maxActiveLinks`).
      operationId: createLink
      security:
        - AdminSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
      responses:
        '201':
          description: Link created (includes token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessLinkCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Active link limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /links/{id}:
    delete:
      tags: [Access links]
      summary: Revoke an access link
      operationId: revokeLink
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/LinkId'
      responses:
        '200':
          description: Link revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked, link]
                properties:
                  revoked:
                    type: boolean
                    const: true
                  link:
                    $ref: '#/components/schemas/AccessLinkPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /flows:
    get:
      tags: [Flows]
      summary: List flows with revision
      description: |
        AI clients and admins with at least `read` may call this.
        Use `rev` as `expectedRev` when submitting a `replace_flow` proposal.
      operationId: listFlows
      security:
        - AccessLinkBearer: []
        - AdminSession: []
      responses:
        '200':
          description: Flat flows array plus global revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowsSnapshot'
        '401':
          $ref: '#/components/responses/AccessLinkUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/BadGateway'

  /flows/{id}:
    get:
      tags: [Flows]
      summary: Get one flow (tab) with revision
      description: |
        Returns the nested tab shape used as the basis for a `replace_flow`
        proposal payload. Always re-read before proposing so `expectedRev`
        matches the current revision.
      operationId: getFlow
      security:
        - AccessLinkBearer: []
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/FlowId'
      responses:
        '200':
          description: Nested flow tab plus revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AccessLinkUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'

  /proposals:
    get:
      tags: [Proposals]
      summary: List proposals
      description: |
        Admins see all proposals. Access-link clients see only proposals they
        created with that link.
      operationId: listProposals
      security:
        - AccessLinkBearer: []
        - AdminSession: []
      responses:
        '200':
          description: Proposal list
          content:
            application/json:
              schema:
                type: object
                required: [proposals]
                properties:
                  proposals:
                    type: array
                    items:
                      $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/AccessLinkUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Proposals]
      summary: Create a replace_flow proposal
      description: |
        **Access-link Bearer only.** Submits a proposed replacement for one
        flow tab. Does not mutate Node-RED until an admin with `*` approves.

        Include `expectedRev` (preferred; `expected_rev` accepted as alias)
        from the latest `GET /flows` or `GET /flows/{id}` response. The live
        flow revision is checked **at submit time** (**409**
        `version_mismatch` if stale). On approve, a stale revision marks the
        proposal `rejected` with a resubmit message (no deploy).

        `payload.flow` must be a tab object (`id`, `type`, `label?`, `nodes[]`,
        optional `configs[]`). Payloads over 1_500_000 bytes return **413**.
      operationId: createProposal
      security:
        - AccessLinkBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProposalRequest'
      responses:
        '201':
          description: Proposal created (`pending`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AccessLinkUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /proposals/{id}:
    get:
      tags: [Proposals]
      summary: Get one proposal
      operationId: getProposal
      security:
        - AccessLinkBearer: []
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: Proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AccessLinkUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /proposals/{id}/diff:
    get:
      tags: [Proposals]
      summary: Diff a proposal against the current flow
      description: |
        Compares the proposal payload to the live flow tab. Returns counts of
        added / removed / modified nodes, per-node change details, and
        line-level diffs for text fields such as `func` and `template`.
        Added and removed nodes include **all** comparable properties (long
        text fields appear as all-added / all-removed line diffs).
        `baseRevStale` is true when `expectedRev` does not match the current
        revision (approve would fail with a revision conflict).

        Admins with `read` can diff any proposal. Access-link clients can only
        diff proposals they created.
      operationId: getProposalDiff
      security:
        - AccessLinkBearer: []
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: Proposal diff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalDiff'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AccessLinkUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /proposals/{id}/approve:
    post:
      tags: [Proposals]
      summary: Approve and deploy a proposal
      description: |
        Requires full admin permission (`*`). Deploys via the FlowAdapter.
        Optional body `deploymentType`: `nodes` (default from settings),
        `flows`, or `full`.

        Revision conflict: proposal is marked `rejected` with a resubmit
        message (HTTP 200 with `status: rejected`). Other deploy errors mark
        it `failed`. Concurrent approve of the same id returns 409.
      operationId: approveProposal
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveProposalRequest'
      responses:
        '200':
          description: Updated proposal (`approved`, `rejected`, or `failed`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not pending, or approve already in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /proposals/{id}/reject:
    post:
      tags: [Proposals]
      summary: Reject a proposal
      description: Requires full admin permission (`*`). Never mutates flows.
      operationId: rejectProposal
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectProposalRequest'
      responses:
        '200':
          description: Proposal rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Proposal is not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /logs:
    get:
      tags: [Audit log]
      summary: List recent audit log entries
      description: Admin session with at least `read`. Newest entries first.
      operationId: listLogs
      security:
        - AdminSession: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: node-red-session
      description: |
        Node-RED editor admin session established via `adminAuth`.
        Equivalent browser cookie/session auth used by the `/mcp` admin UI.
    AccessLinkBearer:
      type: http
      scheme: bearer
      bearerFormat: access-link
      description: |
        Temporary access-link token from `POST /links` (`token` field).
        On 401, ask the user for a new access link.

  parameters:
    LinkId:
      name: id
      in: path
      required: true
      schema:
        type: string
    FlowId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ProposalId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^prop-'

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Admin authentication required or insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AccessLinkUnauthorized:
      description: |
        Missing (`code: access_link_missing`), wrong scheme such as Basic
        (`code: bearer_scheme_required`), or invalid/expired/revoked/
        pre-restart (`code: access_link_invalid`) access link. Includes
        `WWW-Authenticate: Bearer`. Message instructs the AI to ask the user
        for a new access link (or to use Bearer, not Basic).
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: 'Bearer realm="node-red-ai-access", charset="UTF-8"'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              value:
                error: 'Access link Bearer token is missing. Ask the user for a new access link and send Authorization: Bearer <token>.'
                code: access_link_missing
            basicScheme:
              value:
                error: 'Authorization must use the Bearer scheme (Authorization: Bearer <access-link-token>), not Basic. Ask the user for a new access link.'
                code: bearer_scheme_required
            askForNewLink:
              value:
                error: 'Access link is invalid, expired, revoked, or no longer available after a restart. Ask the user for a new access link.'
                code: access_link_invalid
    VersionConflict:
      description: |
        `expectedRev` does not match the current flow revision
        (`code: version_mismatch`). Re-read flows and resubmit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VersionConflictError'
    Forbidden:
      description: AI features disabled, or full (`*`) permission required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Proposal JSON or audit append exceeds size cap
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PayloadTooLargeError'
    BadGateway:
      description: Upstream Node-RED runtime/Admin API failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string

    PayloadTooLargeError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              type: string
              const: payload_too_large

    VersionConflictError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              type: string
              const: version_mismatch
            expectedRev:
              type: string
            currentRev:
              type: string

    AiAccessSettingsPatch:
      type: object
      properties:
        enabled:
          type: boolean
        allowWithoutAdminAuth:
          type: boolean
        defaultLinkTtlSeconds:
          type: integer
          minimum: 1
        defaultDeploymentType:
          $ref: '#/components/schemas/DeploymentType'
        maxActiveLinks:
          type: integer
          minimum: 1
      additionalProperties: false

    AiAccessSettingsResponse:
      type: object
      required:
        - ok
        - adminAuthEnabled
        - canEdit
        - mcpPageUrl
        - settings
        - sources
        - precedence
      properties:
        ok:
          type: boolean
        adminAuthEnabled:
          type: boolean
        canEdit:
          type: boolean
        permission:
          oneOf:
            - type: string
              enum: [read, '*']
            - type: 'null'
        mcpPageUrl:
          type: string
        apiBase:
          type: string
        settings:
          type: object
          required:
            - enabled
            - allowWithoutAdminAuth
            - defaultLinkTtlSeconds
            - defaultDeploymentType
            - maxActiveLinks
          properties:
            enabled:
              type: boolean
            allowWithoutAdminAuth:
              type: boolean
            defaultLinkTtlSeconds:
              type: integer
            defaultDeploymentType:
              $ref: '#/components/schemas/DeploymentType'
            maxActiveLinks:
              type: integer
        sources:
          type: object
          additionalProperties:
            type: string
            enum: [default, settings.js, disk]
        disk:
          type: object
          additionalProperties: true
        precedence:
          type: array
          items:
            type: string
          description: Highest-wins order for effective values

    Status:
      type: object
      required:
        - ok
        - version
        - adminAuthEnabled
        - aiAccessEnabled
        - aiFeaturesEnabled
        - allowWithoutAdminAuth
        - permission
        - capabilities
        - storageDir
        - defaultLinkTtlSeconds
        - maxActiveLinks
        - defaultDeploymentType
      properties:
        ok:
          type: boolean
        version:
          type: string
        adminAuthEnabled:
          type: boolean
        aiAccessEnabled:
          type: boolean
          description: Master switch from resolved settings (disk / settings.js)
        aiFeaturesEnabled:
          type: boolean
        allowWithoutAdminAuth:
          type: boolean
        permission:
          oneOf:
            - type: string
              enum: [read, '*']
            - type: 'null'
          description: |
            Admin session permission, or `null` for access-link callers
            (AI tokens are not admin sessions — see `caller`).
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        storageDir:
          type: string
        defaultLinkTtlSeconds:
          type: integer
        maxActiveLinks:
          type: integer
        defaultDeploymentType:
          $ref: '#/components/schemas/DeploymentType'
        caller:
          description: Who is calling — admin session or access-link Bearer.
          oneOf:
            - type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  const: admin
                permission:
                  type: string
                  enum: [read, '*']
            - type: object
              required: [kind, linkId]
              properties:
                kind:
                  type: string
                  const: access-link
                linkId:
                  type: string
                label:
                  type: string
                expiresAt:
                  type: string
                  format: date-time
                permissions:
                  type: array
                  items:
                    type: string
                  description: >
                    Access-link capabilities (e.g. status:read, flows:read,
                    proposals:create, proposals:read-own)
                baseUrls:
                  type: object
                  required: [api, rpc, openapi, discovery]
                  properties:
                    api:
                      type: string
                    rpc:
                      type: string
                    openapi:
                      type: string
                    discovery:
                      type: string

    Capabilities:
      type: object
      required: [view, manageLinks, approveProposals]
      properties:
        view:
          type: boolean
        manageLinks:
          type: boolean
        approveProposals:
          type: boolean

    DeploymentType:
      type: string
      enum: [nodes, flows, full]
      default: nodes

    AccessLinkPublic:
      type: object
      required: [id, createdAt, expiresAt]
      properties:
        id:
          type: string
        label:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        createdBy:
          type: string

    AccessLinkCreated:
      allOf:
        - $ref: '#/components/schemas/AccessLinkPublic'
        - type: object
          required: [token, url]
          properties:
            token:
              type: string
              description: Raw bearer token (returned only at creation)
            url:
              type: string
              description: >
                Self-contained GET link (`http(s)://{host}{httpAdminRoot}/mcp/a/{token}`).
                Preferred for chat AIs that can only HTTP GET.

    CreateLinkRequest:
      type: object
      properties:
        ttlSeconds:
          type: number
          exclusiveMinimum: 0
          description: Lifetime in seconds (default 14400 = 4h)
        label:
          type: string

    FlowsSnapshot:
      type: object
      required: [rev, flows]
      properties:
        rev:
          type: string
        flows:
          type: array
          items:
            type: object
            additionalProperties: true

    FlowSnapshot:
      type: object
      required: [rev, flow]
      properties:
        rev:
          type: string
        flow:
          $ref: '#/components/schemas/FlowTab'

    FlowTab:
      type: object
      description: |
        Nested tab shape from `GET /flows/{id}` / `get_flow`. Reuse this object
        as `payload.flow` on `submit_proposal`. `get_flow` always includes
        `type` (defaults to `tab` when Node-RED omits it) and `nodes` (array,
        possibly empty). `configs` is optional.
      required: [id, type, nodes]
      properties:
        id:
          type: string
        type:
          type: string
          description: Tab/subflow type; `get_flow` defaults omitted values to `tab`
          default: tab
        label:
          type: string
        disabled:
          type: boolean
        info:
          type: string
        env:
          type: array
          items: {}
        nodes:
          type: array
          description: Child nodes for the tab (required on submit_proposal)
          items:
            type: object
            additionalProperties: true
        configs:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    ProposalStatus:
      type: string
      enum: [pending, approved, rejected, failed]

    Proposal:
      type: object
      required:
        - id
        - type
        - status
        - expectedRev
        - payload
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        type:
          type: string
          const: replace_flow
        status:
          $ref: '#/components/schemas/ProposalStatus'
        expectedRev:
          type: string
        payload:
          $ref: '#/components/schemas/ReplaceFlowPayload'
        createdBy:
          $ref: '#/components/schemas/ProposalCreator'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        decidedBy:
          $ref: '#/components/schemas/ProposalDecisionBy'
        reason:
          type: string
          description: |
            Present when rejected or failed. On revision conflict after
            approve, explains that expectedRev is stale and the AI should
            re-read flows and submit a new proposal.
        resultRev:
          type: string

    ReplaceFlowPayload:
      type: object
      required: [flowId, flow]
      properties:
        flowId:
          type: string
        flow:
          $ref: '#/components/schemas/FlowTab'

    ProposalCreator:
      type: object
      required: [kind, linkId]
      properties:
        kind:
          type: string
          const: access-link
        linkId:
          type: string
        label:
          type: string

    ProposalDecisionBy:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          const: admin
        username:
          type: string

    CreateProposalRequest:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          const: replace_flow
        expectedRev:
          type: string
          description: Preferred field name for the current flow revision
        expected_rev:
          type: string
          description: Alias for expectedRev
        payload:
          $ref: '#/components/schemas/ReplaceFlowPayload'
      example:
        type: replace_flow
        expectedRev: 'abc123rev'
        payload:
          flowId: tab1
          flow:
            id: tab1
            type: tab
            label: Flow 1
            nodes:
              - id: n1
                type: inject
                z: tab1
                wires:
                  - []

    ApproveProposalRequest:
      type: object
      properties:
        deploymentType:
          $ref: '#/components/schemas/DeploymentType'

    RejectProposalRequest:
      type: object
      properties:
        reason:
          type: string
          default: Rejected by admin

    ProposalDiffLine:
      type: object
      required: [op, text]
      properties:
        op:
          type: string
          enum: [equal, add, remove]
        text:
          type: string

    ProposalDiffPropertyChange:
      oneOf:
        - type: object
          required: [key, kind, before, after]
          properties:
            key:
              type: string
            kind:
              const: scalar
            before: {}
            after: {}
        - type: object
          required: [key, kind, before, after, lines]
          properties:
            key:
              type: string
            kind:
              const: text
            before:
              type: string
            after:
              type: string
            lines:
              type: array
              items:
                $ref: '#/components/schemas/ProposalDiffLine'

    ProposalDiffModifiedNode:
      type: object
      required: [id, type, changes]
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
        changes:
          type: array
          description: |
            For modified nodes: only changed properties.
            For added nodes: every comparable property (text fields as all-added lines).
            For removed nodes: every comparable property (text fields as all-removed lines).
          items:
            $ref: '#/components/schemas/ProposalDiffPropertyChange'

    ProposalDiff:
      type: object
      required:
        - proposalId
        - flowId
        - expectedRev
        - currentRev
        - baseRevStale
        - summary
        - added
        - removed
        - modified
      properties:
        proposalId:
          type: string
        flowId:
          type: string
        expectedRev:
          type: string
        currentRev:
          type: string
        baseRevStale:
          type: boolean
          description: True when expectedRev does not match the live flow revision
        summary:
          type: object
          required: [added, removed, modified, tabChanges]
          properties:
            added:
              type: integer
            removed:
              type: integer
            modified:
              type: integer
            tabChanges:
              type: array
              items:
                type: string
        added:
          type: array
          items:
            $ref: '#/components/schemas/ProposalDiffModifiedNode'
        removed:
          type: array
          items:
            $ref: '#/components/schemas/ProposalDiffModifiedNode'
        modified:
          type: array
          items:
            $ref: '#/components/schemas/ProposalDiffModifiedNode'

    AuditActor:
      oneOf:
        - type: object
          required: [kind, linkId]
          properties:
            kind:
              const: access-link
            linkId:
              type: string
            label:
              type: string
        - type: object
          required: [kind]
          properties:
            kind:
              const: admin
            username:
              type: string
        - type: object
          required: [kind]
          properties:
            kind:
              const: system

    AuditEntry:
      type: object
      required: [id, at, action, actor]
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        action:
          type: string
        actor:
          $ref: '#/components/schemas/AuditActor'
        details:
          type: object
          additionalProperties: true
