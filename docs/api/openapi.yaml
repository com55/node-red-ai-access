openapi: 3.1.0

info:
  title: Node-RED AI Access Plugin API
  version: 0.1.0
  summary: Temporary, owner-approved Node-RED access for AI clients
  description: |
    REST surface exposed by the `@com55/node-red-ai-access` Node-RED plugin
    under the editor admin root (respects `httpAdminRoot`).

    ## Base path

    All routes are under `{httpAdminRoot}/mcp/api/v1`
    (for example `/mcp/api/v1` when `httpAdminRoot` is `/`).

    ## Authentication

    - **Admin session** — Node-RED `adminAuth` cookie/session. Users with
      `read` may view status, flows, proposals, and logs. Users with `*` may
      also manage access links and approve/reject proposals.
    - **Access-link Bearer token** — temporary token minted by an admin with
      `*`. AI clients send `Authorization: Bearer <token>` to read flows and
      submit proposals. Tokens are in-memory only (lost on restart).

    When an access-link token is missing, invalid, expired, revoked, or
    cleared by a restart, AI-facing routes return **401** with a message that
    tells the AI to ask the user for a new access link.

    ## Size limits

    Oversized proposal JSON or audit append payloads return **413** with
    `code: storage_payload_too_large`.

  contact:
    name: com55
    url: https://github.com/com55/node-red-ai-access
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /mcp/api/v1
    description: Relative to Node-RED httpAdminRoot (default `/`)

tags:
  - name: Status
  - name: Access links
  - name: Flows
  - name: Proposals
  - name: Audit log
  - name: Spec

paths:
  /openapi.yaml:
    get:
      tags: [Spec]
      summary: OpenAPI document (YAML)
      operationId: getOpenApiYaml
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 YAML for this API
          content:
            application/yaml:
              schema:
                type: string

  /status:
    get:
      tags: [Status]
      summary: Plugin status
      operationId: getStatus
      security:
        - AdminSession: []
      responses:
        '200':
          description: Status payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /links:
    get:
      tags: [Access links]
      summary: List active access links
      description: Requires full admin permission (`*`).
      operationId: listLinks
      security:
        - AdminSession: []
      responses:
        '200':
          description: Active links (no raw tokens)
          content:
            application/json:
              schema:
                type: object
                required: [links]
                properties:
                  links:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccessLinkPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Access links]
      summary: Create an access link
      description: |
        Requires full admin permission (`*`). The raw `token` is returned
        **once** in this response. Default TTL is 86400 seconds (24h); max
        active links defaults to 10 (`aiAccess.maxActiveLinks`).
      operationId: createLink
      security:
        - AdminSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
      responses:
        '201':
          description: Link created (includes token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessLinkCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Active link limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /links/{id}:
    delete:
      tags: [Access links]
      summary: Revoke an access link
      operationId: revokeLink
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/LinkId'
      responses:
        '200':
          description: Link revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked, link]
                properties:
                  revoked:
                    type: boolean
                    const: true
                  link:
                    $ref: '#/components/schemas/AccessLinkPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /flows:
    get:
      tags: [Flows]
      summary: List flows with revision
      description: |
        AI clients and admins with at least `read` may call this.
        Use `rev` as `expectedRev` when submitting a `replace_flow` proposal.
      operationId: listFlows
      security:
        - AccessLinkBearer: []
        - AdminSession: []
      responses:
        '200':
          description: Flat flows array plus global revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowsSnapshot'
        '401':
          $ref: '#/components/responses/AccessLinkUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/BadGateway'

  /flows/{id}:
    get:
      tags: [Flows]
      summary: Get one flow (tab) with revision
      description: |
        Returns the nested tab shape used as the basis for a `replace_flow`
        proposal payload. Always re-read before proposing so `expectedRev`
        matches the current revision.
      operationId: getFlow
      security:
        - AccessLinkBearer: []
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/FlowId'
      responses:
        '200':
          description: Nested flow tab plus revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AccessLinkUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'

  /proposals:
    get:
      tags: [Proposals]
      summary: List proposals
      description: |
        Admins see all proposals. Access-link clients see only proposals they
        created with that link.
      operationId: listProposals
      security:
        - AccessLinkBearer: []
        - AdminSession: []
      responses:
        '200':
          description: Proposal list
          content:
            application/json:
              schema:
                type: object
                required: [proposals]
                properties:
                  proposals:
                    type: array
                    items:
                      $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/AccessLinkUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Proposals]
      summary: Create a replace_flow proposal
      description: |
        **Access-link Bearer only.** Submits a proposed replacement for one
        flow tab. Does not mutate Node-RED until an admin with `*` approves.

        Include `expectedRev` (or `expected_rev`) from the latest
        `GET /flows` or `GET /flows/{id}` response. On approve, a stale
        revision marks the proposal `rejected` with a resubmit message
        (no deploy).
      operationId: createProposal
      security:
        - AccessLinkBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProposalRequest'
      responses:
        '201':
          description: Proposal created (`pending`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AccessLinkUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /proposals/{id}:
    get:
      tags: [Proposals]
      summary: Get one proposal
      operationId: getProposal
      security:
        - AccessLinkBearer: []
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      responses:
        '200':
          description: Proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AccessLinkUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /proposals/{id}/approve:
    post:
      tags: [Proposals]
      summary: Approve and deploy a proposal
      description: |
        Requires full admin permission (`*`). Deploys via the FlowAdapter.
        Optional body `deploymentType`: `nodes` (default from settings),
        `flows`, or `full`.

        Revision conflict: proposal is marked `rejected` with a resubmit
        message (HTTP 200 with `status: rejected`). Other deploy errors mark
        it `failed`. Concurrent approve of the same id returns 409.
      operationId: approveProposal
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveProposalRequest'
      responses:
        '200':
          description: Updated proposal (`approved`, `rejected`, or `failed`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not pending, or approve already in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /proposals/{id}/reject:
    post:
      tags: [Proposals]
      summary: Reject a proposal
      description: Requires full admin permission (`*`). Never mutates flows.
      operationId: rejectProposal
      security:
        - AdminSession: []
      parameters:
        - $ref: '#/components/parameters/ProposalId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectProposalRequest'
      responses:
        '200':
          description: Proposal rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Proposal is not pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'

  /logs:
    get:
      tags: [Audit log]
      summary: List recent audit log entries
      description: Admin session with at least `read`. Newest entries first.
      operationId: listLogs
      security:
        - AdminSession: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                required: [logs]
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    AdminSession:
      type: apiKey
      in: cookie
      name: node-red-session
      description: |
        Node-RED editor admin session established via `adminAuth`.
        Equivalent browser cookie/session auth used by the `/mcp` admin UI.
    AccessLinkBearer:
      type: http
      scheme: bearer
      bearerFormat: access-link
      description: |
        Temporary access-link token from `POST /links` (`token` field).
        On 401, ask the user for a new access link.

  parameters:
    LinkId:
      name: id
      in: path
      required: true
      schema:
        type: string
    FlowId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ProposalId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^prop-'

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Admin authentication required or insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AccessLinkUnauthorized:
      description: |
        Missing, invalid, expired, revoked, or pre-restart access link.
        Message instructs the AI to ask the user for a new access link.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            askForNewLink:
              value:
                error: Access link is invalid, expired, revoked, or no longer available after a restart. Ask the user for a new access link.
    Forbidden:
      description: AI features disabled, or full (`*`) permission required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Proposal JSON or audit append exceeds size cap
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PayloadTooLargeError'
    BadGateway:
      description: Upstream Node-RED runtime/Admin API failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string

    PayloadTooLargeError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code:
              type: string
              const: storage_payload_too_large

    Status:
      type: object
      required:
        - ok
        - version
        - adminAuthEnabled
        - aiFeaturesEnabled
        - allowWithoutAdminAuth
        - permission
        - capabilities
        - storageDir
        - defaultLinkTtlSeconds
        - maxActiveLinks
        - defaultDeploymentType
      properties:
        ok:
          type: boolean
        version:
          type: string
        adminAuthEnabled:
          type: boolean
        aiFeaturesEnabled:
          type: boolean
        allowWithoutAdminAuth:
          type: boolean
        permission:
          oneOf:
            - type: string
              enum: [read, '*']
            - type: 'null'
        capabilities:
          $ref: '#/components/schemas/Capabilities'
        storageDir:
          type: string
        defaultLinkTtlSeconds:
          type: integer
        maxActiveLinks:
          type: integer
        defaultDeploymentType:
          $ref: '#/components/schemas/DeploymentType'

    Capabilities:
      type: object
      required: [view, manageLinks, approveProposals]
      properties:
        view:
          type: boolean
        manageLinks:
          type: boolean
        approveProposals:
          type: boolean

    DeploymentType:
      type: string
      enum: [nodes, flows, full]
      default: nodes

    AccessLinkPublic:
      type: object
      required: [id, createdAt, expiresAt]
      properties:
        id:
          type: string
        label:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        createdBy:
          type: string

    AccessLinkCreated:
      allOf:
        - $ref: '#/components/schemas/AccessLinkPublic'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Raw bearer token (returned only at creation)

    CreateLinkRequest:
      type: object
      properties:
        ttlSeconds:
          type: number
          exclusiveMinimum: 0
          description: Lifetime in seconds (default 86400)
        label:
          type: string

    FlowsSnapshot:
      type: object
      required: [rev, flows]
      properties:
        rev:
          type: string
        flows:
          type: array
          items:
            type: object
            additionalProperties: true

    FlowSnapshot:
      type: object
      required: [rev, flow]
      properties:
        rev:
          type: string
        flow:
          $ref: '#/components/schemas/FlowTab'

    FlowTab:
      type: object
      description: Nested tab shape for replace_flow proposals
      properties:
        id:
          type: string
        type:
          type: string
        label:
          type: string
        disabled:
          type: boolean
        info:
          type: string
        env:
          type: array
          items: {}
        nodes:
          type: array
          items:
            type: object
            additionalProperties: true
        configs:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    ProposalStatus:
      type: string
      enum: [pending, approved, rejected, failed]

    Proposal:
      type: object
      required:
        - id
        - type
        - status
        - expectedRev
        - payload
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        type:
          type: string
          const: replace_flow
        status:
          $ref: '#/components/schemas/ProposalStatus'
        expectedRev:
          type: string
        payload:
          $ref: '#/components/schemas/ReplaceFlowPayload'
        createdBy:
          $ref: '#/components/schemas/ProposalCreator'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        decidedBy:
          $ref: '#/components/schemas/ProposalDecisionBy'
        reason:
          type: string
          description: |
            Present when rejected or failed. On revision conflict after
            approve, explains that expectedRev is stale and the AI should
            re-read flows and submit a new proposal.
        resultRev:
          type: string

    ReplaceFlowPayload:
      type: object
      required: [flowId, flow]
      properties:
        flowId:
          type: string
        flow:
          $ref: '#/components/schemas/FlowTab'

    ProposalCreator:
      type: object
      required: [kind, linkId]
      properties:
        kind:
          type: string
          const: access-link
        linkId:
          type: string
        label:
          type: string

    ProposalDecisionBy:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          const: admin
        username:
          type: string

    CreateProposalRequest:
      type: object
      required: [type, payload]
      properties:
        type:
          type: string
          const: replace_flow
        expectedRev:
          type: string
          description: Preferred field name for the current flow revision
        expected_rev:
          type: string
          description: Alias for expectedRev
        payload:
          $ref: '#/components/schemas/ReplaceFlowPayload'

    ApproveProposalRequest:
      type: object
      properties:
        deploymentType:
          $ref: '#/components/schemas/DeploymentType'

    RejectProposalRequest:
      type: object
      properties:
        reason:
          type: string
          default: Rejected by admin

    AuditActor:
      oneOf:
        - type: object
          required: [kind, linkId]
          properties:
            kind:
              const: access-link
            linkId:
              type: string
            label:
              type: string
        - type: object
          required: [kind]
          properties:
            kind:
              const: admin
            username:
              type: string
        - type: object
          required: [kind]
          properties:
            kind:
              const: system

    AuditEntry:
      type: object
      required: [id, at, action, actor]
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        action:
          type: string
        actor:
          $ref: '#/components/schemas/AuditActor'
        details:
          type: object
          additionalProperties: true
