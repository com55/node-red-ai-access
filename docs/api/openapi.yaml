                type: string

    FlowTab:
      type: object
      description: |
        Nested tab shape from `GET /flows/{id}` / `get_flow`. Reuse this object
        as `payload.flow` on `submit_proposal`. `get_flow` always includes
        `type` (defaults to `tab` when Node-RED omits it) and `nodes` (array,
        possibly empty). `configs` is optional.
      required: [id, type, nodes]
      properties:
        id:
          type: string
        type:
          type: string
          description: Tab/subflow type; `get_flow` defaults omitted values to `tab`
          default: tab
        label:
          type: string
        disabled:
          type: boolean
        info:
          type: string
        env:
          type: array
          items: {}
        nodes:
          type: array
          description: Child nodes for the tab (required on submit_proposal)
          items:
            type: object
            additionalProperties: true
        configs:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    ProposalRebase:
      type: object
      description: Merge metadata; conflicts contain field names only, never field values.
      properties:
        state:
          type: string
          enum: [clean, merged, conflict]
        rev:
          type: string
        mergedHash:
          type: string
        conflicts:
          type: array
          items:
            type: object
            properties:
              nodeId:
                type: string
              kind:
                type: string
              fields:
                type: array
                items:
                  type: string
              message:
                type: string
              choices:
                type: array
                items:
                  type: string
                  enum: [live, proposed]
        liveChangedCount:
          type: integer
        checkedAt:
          type: string
          format: date-time

    ProposalStatus:
      type: string
      enum: [pending, conflict, approved, rejected, failed, withdrawn, expired, superseded]

    Proposal:
      type: object
      required:
        - id
        - type
        - status
        - expectedRev
        - payload
        - createdBy
        - createdAt
        - updatedAt
        - title
        - displayName
        - reviewUrl
        - reviewPath
      properties:
        deployPending:
          type: object
          description: Timed-out deployment has an unknown outcome; approvals wait until settlement or the hard cap. Check live flows before approving again.
          required: [mergedHash, reason]
          properties:
            mergedHash:
              type: string
            reason:
              type: string
            queueReleased:
              type: boolean
              description: True when the deploy hard cap released the queue. Late settlement no longer updates this proposal; approval always re-reads live flows.
        rebase:
          $ref: '#/components/schemas/ProposalRebase'
        id:
          type: string
        type:
          type: string
          const: replace_flow
        status:
          $ref: '#/components/schemas/ProposalStatus'
        expectedRev:
          type: string
        payload:
          $ref: '#/components/schemas/ReplaceFlowPayload'
        baseFlow:
          $ref: '#/components/schemas/FlowTab'
          description: |
            Flow tab snapshot at `expectedRev` when the proposal was submitted.
            Diffs compare `payload.flow` against this base. Omitted on legacy
            proposals created before this field existed.
        title:
          type: string
          maxLength: 80
          description: |
            Short human display title. Set at submit (AI-supplied or
            auto-generated); ` in <flowLabel>` is appended when the title does
            not already name the flow. Always present on API responses
            (resolved for legacy rows).
        storedTitle:
          type: string
          maxLength: 80
          description: |
            The title as saved. With an AI-supplied title this is that title
            (sanitized) without the ` in <flowLabel>` suffix that `title` may
            add. When no title was given it is the auto-generated title, which
            may already contain the flow name. Present on every proposal
            response, including submit.
        flowLabel:
          type: string
          description: |
            Human label of the target flow tab (stored snapshot, else the live
            flows). Empty string when unknown.
        displayName:
          type: string
          description: |
            `title · <submitted datetime>` in Node-RED **server local time**
            with an explicit UTC offset (e.g. `Edit fn1 (function) · 16 Oct 01:35 +00:00`).
            Prefer this when referring to the proposal with a human. UIs with a
            browser should render `createdAt` in the client's local timezone
            instead of parsing this embedded server clock.
        reviewUrl:
          type: string
          description: |
            Absolute deep link (`https://host/ai-access#proposal=<id>`) built from the
            request Host/protocol. Uses `X-Forwarded-Host` / `X-Forwarded-Proto`
            only when Express `trust proxy` is enabled; otherwise falls back to
            the relative `reviewPath` when Host is unavailable.
        reviewPath:
          type: string
          description: |
            Relative deep link `/ai-access#proposal=<id>` (under `httpAdminRoot` when
            set) that opens the admin page, switches to Proposals, and
            scrolls/highlights this item.
        createdBy:
          $ref: '#/components/schemas/ProposalCreator'
        createdAt:
          type: string
          format: date-time
          description: |
            ISO-8601 instant when the proposal was created. Prefer this for
            client-side local-time rendering.
        updatedAt:
          type: string
          format: date-time
        mine:
          type: boolean
          description: |
            Present on access-link responses: true when this token created the
            proposal.
        conflictingProposals:
          type: array
          description: |
            Pending proposals on the same flow (any token). Included on submit
            and on read of pending proposals when siblings exist.
          items:
            type: object
            required: [id, title, displayName, mine]
            properties:
              id:
                type: string
              title:
                type: string
              displayName:
                type: string
              mine:
                type: boolean
              overlappingNodeIds:
                type: array
                items:
                  type: string
              overlappingFields:
                type: array
                items:
                  type: object
                  required: [nodeId, fields]
                  properties:
                    nodeId:
                      type: string
                    fields:
                      type: array
                      items:
                        type: string
        decidedBy:
          $ref: '#/components/schemas/ProposalDecisionBy'
        reason:
          type: string
          description: |
            Present when rejected, failed, withdrawn, or expired. Revision changes
            keep open proposals pending or in conflict; they do not close them.
        resultRev:
          type: string

    ReplaceFlowPayload:
      type: object
      required: [flowId]
      description: |
        **Canonical form (preferred):** `{ flowId, nodes: [op…] }` with no
        `flow`. Ops apply to the live tab at top-level `expectedRev`.

        Supported `nodes[]` ops:
        - `replace_text` — `{ op:"replace_text", node, field, find, replace, occurrence? }`
        - `set` — `{ id, set:{…} }` or `{ op:"set", id, …props }`
        - `add` — `{ op:"add", node:{ id, type, … } }`
        - `remove` — `{ op:"remove", id }` (or `{ id }` remove shape)

        **Alternative:** top-level `nodes` on `CreateProposalRequest` is an
        alias for `payload.nodes` (same shapes).

        **Full tab:** `{ flowId, flow }` from `GET /flows/{id}` still works
        (optionally with `nodes` applied first when both are present).
      properties:
        flowId:
          type: string
        flow:
          $ref: '#/components/schemas/FlowTab'
        nodes:
          type: array
          description: |
            Canonical node ops (`replace_text` / `set` / `add` / `remove`)
            applied to the live tab when `flow` is omitted
          items:
            type: object
            additionalProperties: true

    ProposalCreator:
      type: object
      required: [kind, linkId]
      properties:
        kind:
          type: string
          const: access-link
        linkId:
          type: string
        label:
          type: string

    ProposalDecisionBy:
      type: object
      required: [kind]
      description: |
        Admin for approve/reject/fail; access-link for withdraw.
      properties:
        kind:
          type: string
          enum: [admin, access-link]
        username:
          type: string
        linkId:
          type: string
        label:
          type: string

    CreateProposalRequest:
      type: object
      required: [type, expectedRev, payload]
      properties:
        type:
          type: string
          const: replace_flow
        expectedRev:
          type: string
          description: Preferred field name for the current flow revision (required)
        expected_rev:
          type: string
          description: Alias for expectedRev
        title:
          type: string
          maxLength: 80
          description: |
            Optional short human title (≤80 chars, sanitized). Auto-generated
            from the change set when omitted.
        payload:
          $ref: '#/components/schemas/ReplaceFlowPayload'
        nodes:
          type: array
          description: Optional top-level alias for payload.nodes
          items:
            type: object
            additionalProperties: true
      example:
        type: replace_flow
        expectedRev: 'abc123rev'
        title: Rename inject to Hello
        payload:
          flowId: tab1
          nodes:
            - op: replace_text
              node: n1
              field: template
              find: Hello
              replace: Hi

    ConflictChoiceRequest:
      type: object
      required: [nodeId, choice]
      properties:
        nodeId:
          type: string
        choice:
          type: string
          enum: [live, proposed]

    ResolveProposalRequest:
      type: object
      required: [expectedRev]
      properties:
        expectedRev:
          type: string
        title:
          type: string
          maxLength: 80
        payload:
          $ref: '#/components/schemas/ReplaceFlowPayload'
        nodes:
          type: array
          items:
            type: object
            additionalProperties: true

    ApproveProposalRequest:
      type: object
      properties:
        mergedHash:
          type: string
          description: Hash of the reviewed merged result; required when editor changes are merged.
        deploymentType:
          $ref: '#/components/schemas/DeploymentType'

    RejectProposalRequest:
      type: object
      properties:
        reason:
          type: string
          default: Rejected by admin

    ProposalDiffLine:
      type: object
      required: [op, text]
      properties:
        op:
          type: string
          enum: [equal, add, remove]
        text:
          type: string

    ProposalDiffPropertyChange:
      oneOf:
        - type: object
          required: [key, kind, before, after]
          properties:
            key:
              type: string
            kind:
              const: scalar
            before: {}
            after: {}
        - type: object
          required: [key, kind, before, after, lines]
          properties:
            key:
              type: string
            kind:
              const: text
            before:
              type: string
            after:
              type: string
            lines:
              type: array
              items:
                $ref: '#/components/schemas/ProposalDiffLine'

    ProposalDiffModifiedNode:
      type: object
      required: [id, type, changes]
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
        changes:
          type: array
          description: Changed properties only (modified nodes).
          items:
            $ref: '#/components/schemas/ProposalDiffPropertyChange'

    ProposalDiffPresenceProperty:
      type: object
      required: [key, kind, value]
      properties:
        key:
          type: string
        kind:
          type: string
          enum: [scalar, text]
        value: {}
        preview:
          type: string
          enum: [html]
          description: When set, the /ai-access dashboard may offer a sandboxed HTML preview.

    ProposalDiffPresenceNode:
      type: object
      required: [id, type, summary, keyFields, properties]
      description: |
        Added or removed node as one readable block: summary sentence, key
        fields (name, wires by node name, code/HTML), and full properties.
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
        summary:
          type: string
          description: |
            Human sentence, e.g. Adds template node "demo-html" to flow "Test Flow".
        keyFields:
          type: array
          items:
            $ref: '#/components/schemas/ProposalDiffPresenceProperty'
        properties:
          type: array
          description: 'Full property list (UI: under All properties).'
          items:
            $ref: '#/components/schemas/ProposalDiffPresenceProperty'

    ProposalDiffSections:
      type: object
      required: [summary, added, removed, modified]
      properties:
        summary:
          type: object
          required: [added, removed, modified, tabChanges]
          properties:
            added:
              type: integer
            removed:
              type: integer
            modified:
              type: integer
            tabChanges:
              type: array
              items:
                type: string
        added:
          type: array
          items:
            $ref: '#/components/schemas/ProposalDiffPresenceNode'
        removed:
          type: array
          items:
            $ref: '#/components/schemas/ProposalDiffPresenceNode'
        modified:
          type: array
          items:
            $ref: '#/components/schemas/ProposalDiffModifiedNode'

    ProposalDiff:
      allOf:
        - $ref: '#/components/schemas/ProposalDiffSections'
        - type: object
          required:
            - proposalId
            - flowId
            - expectedRev
            - currentRev
            - baseRevStale
            - compareAgainst
          properties:
            proposalId:
              type: string
            flowId:
              type: string
            expectedRev:
              type: string
            currentRev:
              type: string
            baseRevStale:
              type: boolean
              description: |
                Informational: true for open proposals when expectedRev ≠ live rev.
                Never true for approved/rejected/failed.
            compareAgainst:
              type: string
              enum: [base, current]
            baseSnapshotMissing:
              type: boolean
              description: True for legacy proposals without a stored baseFlow
            rebase:
              $ref: '#/components/schemas/ProposalRebase'
            liveChanges:
              $ref: '#/components/schemas/ProposalDiffSections'
            vsCurrent:
              $ref: '#/components/schemas/ProposalDiffSections'
              description: |
                Present for open proposals without conflicts — merged result vs live flow.

    AuditActor:
      oneOf:
        - type: object
          required: [kind, linkId]
          properties:
            kind:
              const: access-link
            linkId:
              type: string
            label:
              type: string
        - type: object
          required: [kind]
          properties:
            kind:
              const: admin
            username:
              type: string
        - type: object
          required: [kind]
          properties:
            kind:
              const: system

    AuditEntry:
      type: object
      required: [id, at, action, actor]
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        action:
          type: string
        actor:
          $ref: '#/components/schemas/AuditActor'
        details:
          type: object
          additionalProperties: true
