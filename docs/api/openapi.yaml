    AccessLinkKind:
      type: string
      enum: [get_link, rest, mcp]
      description: |
        Surface this token is minted for (admin `POST /links` only):
        - `get_link` → path token on `/mcp/a/<token>/…` (GET-only; **cannot**
          create further tokens)
        - `rest` → `Authorization: Bearer` on this REST API
        - `mcp` → `Authorization: Bearer` on `/mcp/rpc`
        Default on create when omitted: `get_link`. Wrong surface → **403**
        `wrong_token_kind`.

    AccessLinkPublic:
