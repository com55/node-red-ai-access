      type: object
      properties:
        ttlSeconds:
          type: number
          exclusiveMinimum: 0
          description: |
            Lifetime in seconds (default 14400 = 4h). Caps by `kind`:
            `get_link` ≤ 86400 (24h); `rest` / `mcp` ≤ 2592000 (30d).
            Over the cap → **400**.
        label:
          type: string
        kind:
          $ref: '#/components/schemas/AccessLinkKind'
          description: |
            Token surface (default `get_link`). Unknown values return
            **400** `invalid_link_kind`.

